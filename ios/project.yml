name: LinkUp
options:
  bundleIdPrefix: com.linkup
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LinkUp:
    type: application
    platform: iOS
    sources:
      - path: LinkUp
    info:
      path: LinkUp/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linkup.app
        PRODUCT_NAME: LinkUp
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          LINKUP_API_BASE_URL: ""
        Release:
          LINKUP_API_BASE_URL: ""
    scheme:
      testTargets:
        - LinkUpTests
  LinkUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LinkUpTests
    dependencies:
      - target: LinkUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linkup.app.tests
