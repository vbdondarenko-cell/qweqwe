name: LinkUp
options:
  developmentLanguage: en
  bundleIdPrefix: com.linkup
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LinkUp:
    type: application
    platform: iOS
    sources:
      - path: LinkUp
    info:
      path: LinkUp/Resources/Info.plist
    entitlements:
      path: LinkUp/Resources/LinkUp.entitlements
      properties:
        com.apple.developer.associated-domains:
          - "$(LINKUP_RECOVERY_ASSOCIATED_DOMAIN)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linkup.app
        PRODUCT_NAME: LinkUp
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          LINKUP_API_BASE_URL: ""
          LINKUP_RECOVERY_RESET_URL: ""
          LINKUP_RECOVERY_ASSOCIATED_DOMAIN: "applinks:example.invalid"
          LINKUP_PRIVACY_URL: ""
          LINKUP_TERMS_URL: ""
        Release:
          LINKUP_API_BASE_URL: ""
          LINKUP_RECOVERY_RESET_URL: ""
          LINKUP_RECOVERY_ASSOCIATED_DOMAIN: "applinks:example.invalid"
          LINKUP_PRIVACY_URL: ""
          LINKUP_TERMS_URL: ""
    scheme:
      testTargets:
        - LinkUpTests
  LinkUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LinkUpTests
    dependencies:
      - target: LinkUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linkup.app.tests
